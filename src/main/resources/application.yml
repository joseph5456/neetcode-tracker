spring:
  application:
    name: neetcode-tracker

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/neetcode_tracker}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    # Ensures Hibernate creates tables before data.sql tries to seed them
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-string-in-production-min-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    org.springframework.security: INFO
