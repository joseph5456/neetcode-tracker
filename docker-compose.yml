version: "3.8"

services:
  db:
    image: postgres:16
    container_name: neetcode-db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neetcode_tracker
    ports:
      - "5432:5432"
    volumes:
      - neetcode-db-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: neetcode-app
    depends_on:
      - db
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/neetcode_tracker
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: local-dev-secret-change-me-if-you-care-32-bytes-min
    ports:
      - "8080:8080"

volumes:
  neetcode-db-data:
